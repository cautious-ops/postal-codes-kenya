    <script type="application/ld+json">
      [
        {
          "@context": "https://schema.org",
          "@type": "WebApplication",
          "name": "Kenya Postal Directory",
          "description": "Search all 647 official Kenyan postal codes by town, post office, or 5-digit code with a free public JSON and CSV API.",
          "applicationCategory": "UtilityApplication",
          "operatingSystem": "All",
          "offers": {
            "@type": "Offer",
            "price": "0",
            "priceCurrency": "KES"
          }
        },
        {
          "@context": "https://schema.org",
          "@type": "FAQPage",
          "mainEntity": [
            {
              "@type": "Question",
              "name": "What is the postal code for Nairobi, Kenya?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "The main postal code for Nairobi GPO is 00100. Other Nairobi areas use 00100–00800 prefixes such as City Square (00200), Westlands (00800), Karen (00502), Eastleigh (00610), and Kilimani / Yaya Towers (00508)."
              }
            },
            {
              "@type": "Question",
              "name": "How many digits is a Kenyan postal code?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Kenya uses a 5-digit postal code format (00100 to 90408), where the first digit identifies one of Kenya's 10 postal regions."
              }
            },
            {
              "@type": "Question",
              "name": "What are the postal code prefixes across Kenya's regions?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "0xxxx is Nairobi & Metro, 1xxxx is Central (Nyeri), 2xxxx is South & Central Rift (Nakuru), 3xxxx is North Rift (Eldoret), 4xxxx is Nyanza (Kisumu), 5xxxx is Western (Kakamega), 6xxxx is Upper Eastern (Embu/Meru), 7xxxx is North Eastern (Garissa), 8xxxx is Coast (Mombasa/Nyali), and 9xxxx is Lower Eastern (Machakos/Kitui)."
              }
            }
          ]
        }
      ]
    </script>
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('kpd-theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || (!saved && prefersDark)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
